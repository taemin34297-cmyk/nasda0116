<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <div th:replace="~{layout/header :: head}"></div>
    <title>비밀번호 찾기 - 나의 영감 저장소</title>
</head>

<body class="bg-[#F9F6F1] min-h-screen flex flex-col">
<div th:replace="~{layout/header :: header}"></div>

<main class="flex-1 flex items-center justify-center py-12 px-6">
    <div class="max-w-md w-full bg-white p-8 rounded-3xl border border-[#E8D5C4]/30 shadow-sm">

        <div class="text-center mb-10">
            <h2 class="text-2xl font-bold text-[#5A4D41] mb-2" style="font-family:'Noto Sans KR', sans-serif;">비밀번호 찾기</h2>
            <p class="text-sm text-[#A89080]">아이디와 가입 시 등록한 이메일을 입력하시면<br>임시 비밀번호를 보내드립니다.</p>
        </div>

        <div th:if="${errorMessage}" class="mb-6 p-4 bg-red-50 border border-red-100 rounded-xl">
            <p class="text-sm text-red-500 text-center" th:text="${errorMessage}"></p>
        </div>

        <div th:if="${message}" class="mb-6 p-4 bg-green-50 border border-green-100 rounded-xl">
            <p class="text-sm text-green-600 text-center" th:text="${message}"></p>
        </div>

        <form th:action="@{/user/login}" method="post" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-[#8B7355] uppercase tracking-wider mb-2 ml-1">아이디</label>
                <input type="text"
                       name="loginId"
                       required
                       placeholder="아이디를 입력하세요"
                       class="w-full h-14 px-5 rounded-2xl border border-[#E8D5C4]/60 bg-[#FBF8F4] text-[#5A4D41] outline-none focus:ring-2 focus:ring-[#D4C4B0]/30 transition-all placeholder:text-[#A89080]/50"
                       style="font-family:'Noto Sans KR', sans-serif;">
            </div>

            <div>
                <label class="block text-xs font-bold text-[#8B7355] uppercase tracking-wider mb-2 ml-1">가입 시 등록한 이메일</label>
                <input type="email"
                       name="email"
                       required
                       placeholder="example@gmail.com"
                       class="w-full h-14 px-5 rounded-2xl border border-[#E8D5C4]/60 bg-[#FBF8F4] text-[#5A4D41] outline-none focus:ring-2 focus:ring-[#D4C4B0]/30 transition-all placeholder:text-[#A89080]/50"
                       style="font-family:'Noto Sans KR', sans-serif;">
            </div>

            <button type="submit"
                    class="w-full h-14 bg-[#D4C4B0] text-white font-bold rounded-2xl hover:bg-[#C9B5A0] transition-all shadow-md active:scale-[0.98] mt-4"
                    style="font-family:'Noto Sans KR', sans-serif;">
                임시 비밀번호 발송
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-[#F1E9E0] flex justify-center gap-6">
            <a th:href="@{/user/login}" class="text-xs text-[#A89080] hover:text-[#8B7355] transition-colors">로그인으로 돌아가기</a>
            <span class="text-[#E8D5C4]">|</span>
            <a th:href="@{/user/signup}" class="text-xs text-[#A89080] hover:text-[#8B7355] transition-colors">회원가입</a>
        </div>
    </div>
</main>

<div th:replace="~{layout/header :: commonScript}"></div>
</body>
</html>
